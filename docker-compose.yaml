# ---- Anchors ----
x-cassandra-cluster-name: &cassandra-cluster-name cassandra-cluster
x-cassandra-seeds: &cassandra-seeds cassandra-zero, cassandra-one
x-cassandra-dc-1: &cassandra-dc-1 datacenter-1
x-cassandra-rack-1: &cassandra-rack-1 rack-1

x-cassandra-main-port: &cassandra-main-port 9042
x-cassandra-zero-port: &cassandra-zero-port 9042
x-cassandra-one-port: &cassandra-one-port 9043
x-cassandra-two-port: &cassandra-two-port 9044

x-cassandra-port-protocol: &cassandra-port-protocol tcp
x-cassandra-port-mode: &cassandra-port-mode host

x-cassandra-environment: &cassandra-environment
  CASSANDRA_CLUSTER_NAME: *cassandra-cluster-name
  CASSANDRA_SEEDS: *cassandra-seeds
  MAX_HEAP_SIZE: 2g

x-casssandra-default: &cassandra-default
  image: cassandra:5.0.9-trixie
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: 6g
  memswap_limit: 6g
  mem_reservation: 2g
  cpus: 2.0
  networks:
    - cassandra_network
  healthcheck:
    test: ['CMD-SHELL', 'nodetool status | grep -q "^UN"']
    interval: 10s
    timeout: 5s
    retries: 5
  logging:
    driver: 'json-file'
    options:
      max-size: '100m'
      max-file: 5
      compress: 'true'

# ---- Containers ----
services:
  cassandra-zero:
    <<: *cassandra-default
    hostname: cassandra-zero
    container_name: cassandra-zero
    ports:
      - name: cassandra-zero-port
        target: *cassandra-main-port
        host_ip: 127.0.0.1
        published: *cassandra-zero-port
        protocol: *cassandra-port-protocol
        mode: *cassandra-port-mode
    volumes:
      - ./data/cassandra-zero:/var/lib/cassandra
      - ./config/cassandra-zero.yaml:/etc/cassandra/cassandra.yaml
    environment:
      <<: *cassandra-environment
      CASSANDRA_DC: *cassandra-dc-1
      CASSANDRA_RACK: *cassandra-rack-1

  cassandra-one:
    <<: *cassandra-default
    hostname: cassandra-one
    container_name: cassandra-one
    ports:
      - name: cassandra-one-port
        target: *cassandra-main-port
        host_ip: 127.0.0.1
        published: *cassandra-one-port
        protocol: *cassandra-port-protocol
        mode: *cassandra-port-mode
    volumes:
      - ./data/cassandra-one:/var/lib/cassandra
      - ./config/cassandra-one.yaml:/etc/cassandra/cassandra.yaml
    environment:
      <<: *cassandra-environment
      CASSANDRA_DC: *cassandra-dc-1
      CASSANDRA_RACK: *cassandra-rack-1

  cassandra-two:
    <<: *cassandra-default
    hostname: cassandra-two
    container_name: cassandra-two
    ports:
      - name: cassandra-two-port
        target: *cassandra-main-port
        host_ip: 127.0.0.1
        published: *cassandra-two-port
        protocol: *cassandra-port-protocol
        mode: *cassandra-port-mode
    volumes:
      - ./data/cassandra-two:/var/lib/cassandra
      - ./config/cassandra-two.yaml:/etc/cassandra/cassandra.yaml
    environment:
      <<: *cassandra-environment
      CASSANDRA_DC: *cassandra-dc-1
      CASSANDRA_RACK: *cassandra-rack-1

networks:
  cassandra_network:
    name: cassandra-network
    driver: bridge
    external: false
